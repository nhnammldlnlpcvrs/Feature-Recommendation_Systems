version: "3.9"

services:
  db:
    image: postgres:15
    container_name: rs_db-container
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: recommender
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d recommender"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: nhnammldlnlpcvrs/rs_fpgrowth-backend:latest
    container_name: rs_backend-container
    environment:
      - DB_HOST=db
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - DB_NAME=recommender
      - DB_PORT=5432
      - DATA_PATH=/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data
      - ../models:/app/models
      - ../logs:/app/logs

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    image: nhnammldlnlpcvrs/rs_fpgrowth-ui:latest
    container_name: rs_ui-container
    environment:
      - API_URL=http://backend:8000
      - DATA_PATH=/app/data
    ports:
      - "8501:8501"
    volumes:
      - ../ui:/app/ui
      - ../data:/app/data
    depends_on:
      backend:
        condition: service_started

volumes:
  db_data:
